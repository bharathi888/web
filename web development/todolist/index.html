
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        /* Add task area */

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #667eea;
        }

        #addBtn {
            border: none;
            background: #667eea;
            color: white;
            padding: 0 22px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #5568d9;
        }

        /* Filter buttons */

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            border: none;
            background: #eee;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        /* Task list */

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 11px;
            border-radius: 7px;
            color: white;
            cursor: pointer;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .delete-btn {
            background: #ef4444;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        /* Bottom */

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: #666;
        }

        #clearBtn {
            border: none;
            background: #333;
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        #clearBtn:hover {
            background: #111;
        }

        /* Empty message */

        #emptyMessage {
            text-align: center;
            padding: 35px 10px;
            color: #888;
        }

        #emptyMessage .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        #emptyMessage h3 {
            color: #555;
            margin-bottom: 5px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .input-box {
                flex-direction: column;
            }

            #addBtn {
                padding: 13px;
            }

            .task {
                flex-wrap: wrap;
            }

            .edit-btn,
            .delete-btn {
                padding: 7px 10px;
            }

            .bottom {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 My To-Do List</h1>

    <p class="subtitle">
        Organize your tasks and get things done.
    </p>

    <!-- Add Task -->
    <div class="input-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
            autocomplete="off"
        >

        <button id="addBtn">
            + Add Task
        </button>

    </div>

    <!-- Filters -->
    <div class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="active">
            Active
        </button>

        <button class="filter-btn" data-filter="completed">
            Completed
        </button>

    </div>

    <!-- Tasks -->
    <ul id="taskList"></ul>

    <!-- Empty message -->
    <div id="emptyMessage">

        <div class="icon">📋</div>

        <h3>No tasks yet</h3>

        <p>Add your first task above.</p>

    </div>

    <!-- Bottom -->
    <div class="bottom">

        <span id="taskCount">
            0 tasks
        </span>

        <button id="clearBtn">
            Clear Completed
        </button>

    </div>

</div>

<script>

    // ------------------------------
    // Variables
    // ------------------------------

    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");
    const taskCount = document.getElementById("taskCount");
    const clearBtn = document.getElementById("clearBtn");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];

    let currentFilter = "all";


    // ------------------------------
    // Save tasks
    // ------------------------------

    function saveTasks() {

        localStorage.setItem(
            "todoTasks",
            JSON.stringify(tasks)
        );

    }


    // ------------------------------
    // Add task
    // ------------------------------

    function addTask() {

        const text = taskInput.value.trim();

        if (text === "") {

            alert("Please enter a task.");

            taskInput.focus();

            return;
        }

        const newTask = {

            id: Date.now(),

            text: text,

            completed: false

        };

        tasks.push(newTask);

        saveTasks();

        taskInput.value = "";

        taskInput.focus();

        renderTasks();

    }


    // ------------------------------
    // Enter key
    // ------------------------------

    taskInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            addTask();

        }

    });


    // ------------------------------
    // Add button
    // ------------------------------

    addBtn.addEventListener("click", addTask);


    // ------------------------------
    // Render tasks
    // ------------------------------

    function renderTasks() {

        taskList.innerHTML = "";

        let filteredTasks = tasks;

        if (currentFilter === "active") {

            filteredTasks = tasks.filter(function(task) {

                return !task.completed;

            });

        }

        if (currentFilter === "completed") {

            filteredTasks = tasks.filter(function(task) {

                return task.completed;

            });

        }


        // Empty message

        if (filteredTasks.length === 0) {

            emptyMessage.style.display = "block";

        } else {

            emptyMessage.style.display = "none";

        }


        // Create tasks

        filteredTasks.forEach(function(task) {

            const li = document.createElement("li");

            li.className = "task";

            if (task.completed) {

                li.classList.add("completed");

            }


            // Checkbox

            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.className = "checkbox";

            checkbox.checked = task.completed;


            checkbox.addEventListener("change", function() {

                task.completed = checkbox.checked;

                saveTasks();

                renderTasks();

            });


            // Text

            const span = document.createElement("span");

            span.className = "task-text";

            span.textContent = task.text;


            // Edit button

            const editButton = document.createElement("button");

            editButton.className = "edit-btn";

            editButton.textContent = "Edit";


            editButton.addEventListener("click", function() {

                const newText = prompt(
                    "Edit your task:",
                    task.text
                );

                if (
                    newText !== null &&
                    newText.trim() !== ""
                ) {

                    task.text = newText.trim();

                    saveTasks();

                    renderTasks();

                }

            });


            // Delete button

            const deleteButton = document.createElement("button");

            deleteButton.className = "delete-btn";

            deleteButton.textContent = "Delete";


            deleteButton.addEventListener("click", function() {

                const confirmDelete = confirm(
                    "Are you sure you want to delete this task?"
                );

                if (confirmDelete) {

                    tasks = tasks.filter(function(item) {

                        return item.id !== task.id;

                    });

                    saveTasks();

                    renderTasks();

                }

            });


            li.appendChild(checkbox);

            li.appendChild(span);

            li.appendChild(editButton);

            li.appendChild(deleteButton);

            taskList.appendChild(li);

        });


        updateTaskCount();

    }


    // ------------------------------
    // Task count
    // ------------------------------

    function updateTaskCount() {

        const activeTasks = tasks.filter(function(task) {

            return !task.completed;

        }).length;


        if (activeTasks === 1) {

            taskCount.textContent = "1 task remaining";

        } else {

            taskCount.textContent =
                activeTasks + " tasks remaining";

        }

    }


    // ------------------------------
    // Filters
    // ------------------------------

    filterButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            filterButtons.forEach(function(btn) {

                btn.classList.remove("active");

            });

            button.classList.add("active");

            currentFilter =
                button.getAttribute("data-filter");

            renderTasks();

        });

    });


    // ------------------------------
    // Clear completed
    // ------------------------------

    clearBtn.addEventListener("click", function() {

        const completedTasks = tasks.filter(function(task) {

            return task.completed;

        });

        if (completedTasks.length === 0) {

            alert("There are no completed tasks.");

            return;

        }

        tasks = tasks.filter(function(task) {

            return !task.completed;

        });

        saveTasks();

        renderTasks();

    });


    // ------------------------------
    // Start application
    // ------------------------------

    renderTasks();

</script>

</body>
</html>
